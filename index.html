  showLine(x, top, height);
}
function bScroll() {
  if (!bdrag || !bdrag.active) return;
  const edge = 80, y = bdrag.y;
  let dy = 0;
  if (y < edge + 40) dy = -Math.ceil(((edge + 40 - y) / edge) * 14);
  else if (y > innerHeight - edge) dy = Math.ceil(((y - (innerHeight - edge)) / edge) * 14);
  if (dy) { window.scrollBy(0, dy); updateBTarget(); }
  bdRaf = requestAnimationFrame(bScroll);
}
function endBDrag() {
  cancelAnimationFrame(bdRaf);
  if (bdrag) {
    clearTimeout(bdrag.timer);
    if (bdrag.ghost) bdrag.ghost.remove();
    if (bdrag.wrap) bdrag.wrap.classList.remove('dragging');
  }
  document.body.classList.remove('is-dragging');
  hideLine();
}
function cancelBDrag() {
  if (!bdrag) return;
  const was = bdrag.active;
  endBDrag();
  bdrag = null;
  if (was) suppressClickUntil = Date.now() + 350;
}
function onBUp(e) {
  if (!bdrag || e.pointerId !== bdrag.pointerId) return;
  if (!bdrag.active) { clearTimeout(bdrag.timer); bdrag = null; return; }
  const { id, target } = bdrag;
  endBDrag();
  bdrag = null;
  suppressClickUntil = Date.now() + 350;
  if (!target) return;
  const ids = target.ids.slice();
  ids.splice(target.idx, 0, id);
  const bd = S.index.boards.find(x => x.id === id);
  if (bd && ids.join() !== groupIds(bd).join()) setManualOrder(reorderGroup(ids));
}

async function createBoardFlow() {
  const v = await promptBox({ title: 'New board', label: 'Title', placeholder: 'Untitled tier list', confirm: 'Create' });
  if (v == null) return;
  const m = modal({ title: 'Creating board', body: h('div', { class: 'center-inline' }, h('div', { class: 'spinner' })), dismiss: false });
  try {
    const b = newBoard(v.trim(), '');
    await createBoardRemote(b);
    m.close();
    location.hash = '#/b/' + b.id;
  } catch (e) { m.close(); toast(friendlyError(e)); }
}
async function createBoardRemote(b) {
  if (isLocal()) return localCreateBoard(b);
  const bp = boardPath(b.id), dir = imgDir(b.id);
  const message = `Create ${b.title || 'board'}`;
  // Images first, board last: a board never points at a missing file. One write each.
  for (const f of [...referencedImages(b)].filter(f => S.imgs.has(f))) await putImage(dir + f, S.imgs.get(f).blob, message);
  await putFile(bp, ser(b, 2), null, message);
  const now = Date.now();
  await syncIndexEntry(b, { created: now, modified: now });
}
async function renameBoardRemote(bd) {
  const v = await promptBox({ title: 'Rename board', value: bd.title || '', confirm: 'Rename' });
  if (v == null) return;
  try {
    const f = await getFile(boardPath(bd.id));
    if (f) { const b = parseBoard(f.text); b.id = bd.id; b.title = v.trim(); await putFile(boardPath(bd.id), ser(b, 2), f.sha); }
    await updateIndex(idx => { const x = idx.boards.find(y => y.id === bd.id); if (x) { x.title = v.trim(); x.modified = Date.now(); } });
    refreshHome();
  } catch (e) { toast(friendlyError(e)); }
}
// "Name copy", then "Name copy 2", "Name copy 3", and so on. Duplicating a copy numbers it from the original's name.
function copyTitle(title) {
  const base = (String(title || '').trim() || 'Untitled tier list').replace(/ copy(?: \d+)?$/i, '');
  const have = new Set(S.index.boards.map(b => norm(b.title)));
  let t = base + ' copy', n = 2;
  while (have.has(norm(t))) t = `${base} copy ${n++}`;
  return t;
}
async function duplicateBoard(bd) {
  const m = modal({ title: 'Duplicating board', body: h('div', { class: 'center-inline' }, h('div', { class: 'spinner' })), dismiss: false });
  try {
    const f = await getFile(boardPath(bd.id));
    if (!f) throw new Error('That board no longer exists.');
    const src = parseBoard(f.text);
    const id = uid();
    const copy = parseBoard(ser(src));
    copy.id = id; copy.title = copyTitle(src.title);
    const files = await repoFiles();
    const copies = [...referencedImages(src)].filter(n => files.has(imgDir(bd.id) + n)).map(n => ({ path: imgDir(id) + n, sha: files.get(imgDir(bd.id) + n) }));
    await commitFiles(`Duplicate ${src.title || 'board'}`, () => ({ upload: [{ path: boardPath(id), text: ser(copy, 2) }], copy: copies }));
    const now = Date.now();
    await syncIndexEntry(copy, { created: now, modified: now });
    m.close(); refreshHome(); toast('Board duplicated');
  } catch (e) { m.close(); toast(friendlyError(e)); }
}
function moveBoard(id, d) {
  const bd = S.index.boards.find(x => x.id === id);
  if (!bd) return;
  const ids = groupIds(bd);
  const i = ids.indexOf(id), j = i + d;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  setManualOrder(reorderGroup(ids));
}
async function deleteBoard(id, fromBoard) {
  const bd = S.index.boards.find(x => x.id === id) || { title: S.board && S.board.title };
  const ok = await confirmBox(isLocal()
    ? 'This permanently deletes the board and its images from this browser. The app can’t restore them.'
    : 'This permanently deletes the board and its images from your data repository. GitHub keeps older commits, but the app can’t restore them.', { title: `Delete “${bd.title || 'Untitled tier list'}”?`, confirm: 'Delete', danger: true });
  if (!ok) return;
  const m = modal({ title: 'Deleting board', body: h('div', { class: 'center-inline' }, h('div', { class: 'spinner' })), dismiss: false });
  try {
    const dir = `boards/${id}/`;
    await commitFiles('Delete board', files => ({ upload: [], remove: [...files.keys()].filter(p => p.startsWith(dir)) }));
    await updateIndex(idx => { idx.boards = idx.boards.filter(x => x.id !== id); if (Array.isArray(idx.order)) idx.order = idx.order.filter(x => x !== id); });
    setPendMod(id, 0);
    if (fromBoard) { S.board = null; S.dirty = false; S.conflict = null; }
    m.close();
    if (fromBoard) location.hash = ''; else refreshHome();
  } catch (e) { m.close(); toast(friendlyError(e)); }
}

// ---------- Routing and startup ----------
let routing = Promise.resolve();
function route() {
  routing = routing.then(doRoute).catch(e => renderFatal(e));
  return routing;
}
async function doRoute() {
  if (!S.mode) { renderSetup(); return; }
  const m = location.hash.match(/^#\/b\/([\w-]+)$/);
  if (m && S.board && m[1] === S.board.id && $('#boardBody')) return; // already open
  if (S.board && (!m || m[1] !== S.board.id)) {
    if (S.pauseAuto && S.dirty && !S.conflict) {
      if (!(await resolveUnsaved())) { history.replaceState(null, '', '#/b/' + S.board.id); return; }
    }
    if (S.dirty && !S.conflict) await saveNow(false);
    if (S.dirty && !S.conflict) toast(isLocal() ? 'Your last changes could not be saved. This browser might be out of storage space.' : (S.draftOk ? 'Your last changes could not be saved yet. They are kept on this device.' : 'Your last changes could not be saved.'));
    if (!S.dirty && !S.conflict) {
      const plan = housekeepingPlan();
      if (plan && (plan.metaChanged || plan.orphans.length) && writesLastHour() < AUTO_CAP && backoffLeftMs() === 0) { renderLoading('Finishing up…'); await flushHousekeeping(); }
    }
  }
  if (m) { flushHome(); await openBoard(m[1]); return; }
  try { if (!S.index.sha && !S.index.boards.length) await loadIndex(); } catch (e) { renderFatal(e); return; }
  await renderHome();
}

// Pick up edits from another device (or tab) when returning to a tab with no unsaved changes.
async function checkRemote() {
  if (!S.board || S.dirty || S.saving || S.conflict || document.hidden) return;
  if (Date.now() - S.lastCheck < 30000) return;
  S.lastCheck = Date.now();
  try {
    const f = await getFile(boardPath(S.board.id));
    if (f && f.sha !== S.boardSha && !S.dirty && !S.saving) {
      await refreshRepo();
      adoptRemote(f.text, f.sha);
      toast(isLocal() ? 'Updated with changes from another tab' : 'Updated with changes from another device');
    }
  } catch { /* ignore */ }
}

function onKeys(e) {
  const mod = e.metaKey || e.ctrlKey;
  if (!mod || !S.board || modalStack.length) return;
  const typing = /^(input|textarea|select)$/i.test((e.target.tagName || ''));
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); saveNow(true); }
  else if (typing) return;
  else if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); doRedo(); }
}

function boot() {
  S.prefs = Object.assign(S.prefs, lsGet('tl.prefs', {}));
  // An earlier build stored the label width in pixels. Convert it to a multiple of the label text size.
  if (S.prefs.labelW && !S.prefs.labelEm) S.prefs.labelEm = Math.round((S.prefs.labelW / Math.min(26, Math.max(14, tileSize() * 0.22))) * 100) / 100;
  delete S.prefs.labelW;
  // 1.6.0 changed the default sort. Apply it once, then keep whatever the person picks.
  if (S.prefs.sortV !== 2) { S.prefs.sort = 'created'; S.prefs.sortDir = null; S.prefs.sortV = 2; savePrefs(); }
  S.cfg = lsGet('tl.cfg', null);
  S.mode = S.cfg ? 'github' : (lsGet('tl.mode', null) === 'local' ? 'local' : null);
  applyTheme();
  document.addEventListener('keydown', onKeys);
  window.addEventListener('hashchange', route);
  // Leaving the page: keep the work in the local draft. Ask first only when that copy isn't safe yet.
  // Boards stored on this device have no draft: a save starts at once, and the prompt covers the moment it takes.
  window.addEventListener('beforeunload', e => {
    if (!(S.board && S.dirty)) return;
    if (isLocal()) { saveNow(false); e.preventDefault(); e.returnValue = ''; return; }
    if (!S.pauseAuto) flushDraft();
    if (S.pauseAuto || !S.draftOk || S.draftDirty) { e.preventDefault(); e.returnValue = ''; }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { flushHome(); if (S.board && S.dirty && !S.pauseAuto) { flushDraft(); tick(true); } }
    else checkRemote();
  });
  window.addEventListener('pagehide', () => { if (S.board && S.dirty && !S.pauseAuto) { if (isLocal()) saveNow(false); else flushDraft(); } });
  window.addEventListener('focus', checkRemote);
  setInterval(() => tick(), 2000);
  bindFileDrop();
  route();
}
boot();

</script>
</body>
