const refreshHome = () => { const l = $('.board-grid'); if (l) paintHome(l); };

async function createBoardFlow() {
  const v = await promptBox({ title: 'New board', label: 'Title', placeholder: 'Untitled tier list', confirm: 'Create' });
  if (v == null) return;
  const m = modal({ title: 'Creating board', body: h('div', { class: 'center-inline' }, h('div', { class: 'spinner' })), dismiss: false });
  try {
    const b = newBoard(v.trim(), '');
    await createBoardRemote(b);
    m.close();
    location.hash = '#/b/' + b.id;
  } catch (e) { m.close(); toast(friendlyError(e)); }
}
async function createBoardRemote(b) {
  const bp = boardPath(b.id), dir = imgDir(b.id);
  const imgs = [...referencedImages(b)].filter(f => S.imgs.has(f));
  if (!imgs.length) {
    await putFile(bp, ser(b, 2), null);
  } else {
    await commitFiles(`Create ${b.title || 'board'}`, () => ({ upload: [{ path: bp, text: ser(b, 2) }, ...imgs.map(f => ({ path: dir + f, blob: S.imgs.get(f).blob }))] }));
  }
  await syncIndexEntry(b);
}
async function renameBoardRemote(bd) {
  const v = await promptBox({ title: 'Rename board', value: bd.title || '', confirm: 'Rename' });
  if (v == null) return;
  try {
    const f = await getFile(boardPath(bd.id));
    if (f) { const b = parseBoard(f.text); b.id = bd.id; b.title = v.trim(); await putFile(boardPath(bd.id), ser(b, 2), f.sha); }
    await updateIndex(idx => { const x = idx.boards.find(y => y.id === bd.id); if (x) x.title = v.trim(); });
    refreshHome();
  } catch (e) { toast(friendlyError(e)); }
}
async function duplicateBoard(bd) {
  const m = modal({ title: 'Duplicating board', body: h('div', { class: 'center-inline' }, h('div', { class: 'spinner' })), dismiss: false });
  try {
    const f = await getFile(boardPath(bd.id));
    if (!f) throw new Error('That board no longer exists.');
    const src = parseBoard(f.text);
    const id = uid();
    const copy = parseBoard(ser(src));
    copy.id = id; copy.title = (src.title || 'Untitled tier list') + ' copy';
    const files = await getTreeFiles(await getHead());
    const copies = [...referencedImages(src)].filter(n => files.files.has(imgDir(bd.id) + n)).map(n => ({ path: imgDir(id) + n, sha: files.files.get(imgDir(bd.id) + n) }));
    await commitFiles(`Duplicate ${src.title || 'board'}`, () => ({ upload: [{ path: boardPath(id), text: ser(copy, 2) }], copy: copies }));
    await syncIndexEntry(copy);
    m.close(); refreshHome(); toast('Board duplicated');
  } catch (e) { m.close(); toast(friendlyError(e)); }
}
async function moveBoard(id, dir) {
  try {
    await updateIndex(idx => {
      const i = idx.boards.findIndex(x => x.id === id), j = i + dir;
      if (i < 0 || j < 0 || j >= idx.boards.length) return;
      [idx.boards[i], idx.boards[j]] = [idx.boards[j], idx.boards[i]];
    });
    refreshHome();
  } catch (e) { toast(friendlyError(e)); }
}
async function deleteBoard(id, fromBoard) {
  const bd = S.index.boards.find(x => x.id === id) || { title: S.board && S.board.title };
  const ok = await confirmBox('This permanently deletes the board and its images from your data repository. GitHub keeps older commits, but the app can’t restore them.', { title: `Delete “${bd.title || 'Untitled tier list'}”?`, confirm: 'Delete', danger: true });
  if (!ok) return;
  const m = modal({ title: 'Deleting board', body: h('div', { class: 'center-inline' }, h('div', { class: 'spinner' })), dismiss: false });
  try {
    const dir = `boards/${id}/`;
    await commitFiles('Delete board', files => ({ upload: [], remove: [...files.keys()].filter(p => p.startsWith(dir)) }));
    await updateIndex(idx => { idx.boards = idx.boards.filter(x => x.id !== id); });
    if (fromBoard) { S.board = null; S.dirty = false; S.conflict = null; }
    m.close();
    if (fromBoard) location.hash = ''; else refreshHome();
  } catch (e) { m.close(); toast(friendlyError(e)); }
}

// ---------- Routing and startup ----------
let routing = Promise.resolve();
function route() {
  routing = routing.then(doRoute).catch(e => renderFatal(e));
  return routing;
}
async function doRoute() {
  if (!S.cfg) { renderSetup(); return; }
  const m = location.hash.match(/^#\/b\/([\w-]+)$/);
  if (S.board && (!m || m[1] !== S.board.id)) {
    if (S.dirty && !S.conflict) await saveNow(false);
    if (S.dirty && !S.conflict) toast('Your last changes could not be saved.');
  }
  if (m) { await openBoard(m[1]); return; }
  try { if (!S.index.sha && !S.index.boards.length) await loadIndex(); } catch (e) { renderFatal(e); return; }
  await renderHome();
}

// Pick up edits from another device when returning to a tab with no unsaved changes.
async function checkRemote() {
  if (!S.board || S.dirty || S.saving || S.conflict || document.hidden) return;
  if (Date.now() - S.lastCheck < 30000) return;
  S.lastCheck = Date.now();
  try {
    const f = await getFile(boardPath(S.board.id));
    if (f && f.sha !== S.boardSha && !S.dirty && !S.saving) {
      await refreshRepo();
      adoptRemote(f.text, f.sha);
      toast('Updated with changes from another device');
    }
  } catch { /* ignore */ }
}

function onKeys(e) {
  const mod = e.metaKey || e.ctrlKey;
  if (!mod || !S.board || modalStack.length) return;
  const typing = /^(input|textarea|select)$/i.test((e.target.tagName || ''));
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); saveNow(true); }
  else if (typing) return;
  else if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); doRedo(); }
}

function boot() {
  S.prefs = Object.assign(S.prefs, lsGet('tl.prefs', {}));
  S.cfg = lsGet('tl.cfg', null);
  applyTheme();
  document.addEventListener('keydown', onKeys);
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', e => { if (S.board && S.dirty) { saveNow(false); e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (S.board && S.dirty) saveNow(false); }
    else checkRemote();
  });
  window.addEventListener('pagehide', () => { if (S.board && S.dirty) saveNow(false); });
  window.addEventListener('focus', checkRemote);
  setInterval(tick, 2000);
  bindFileDrop();
  route();
}
boot();

</script>
</body>
